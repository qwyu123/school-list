<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>开学行李清单</title>
<meta name="description" content="选择学校，自动倒计时，可编辑行李清单">
<style>
  /* ========== Liquid Glass 液态玻璃 ========== */
  :root {
    --bg: #eef2f7;
    --glow-1: rgba(96,165,250,0.28);
    --glow-2: rgba(167,213,190,0.28);
    --glow-3: rgba(196,181,253,0.2);
    --text: #1d2126;
    --text-dim: #6b7280;
    --text-faint: #9aa3ad;
    --accent: #4a90d9;
    --accent-bright: #6aa8e8;
    --accent-soft: rgba(74,144,217,0.12);
    --glass: rgba(255,255,255,0.42);
    --glass-strong: rgba(255,255,255,0.58);
    --glass-border: rgba(255,255,255,0.75);
    --glass-hi: rgba(255,255,255,0.9);
    --shadow: 0 24px 64px rgba(45,70,110,0.14);
    --hairline: rgba(0,0,0,0.06);
    --ok: #58a06b;
    --danger: #d06a5e;
  }
  [data-theme="dark"] {
    --bg: #101218;
    --glow-1: rgba(96,165,250,0.16);
    --glow-2: rgba(167,213,190,0.12);
    --glow-3: rgba(140,130,220,0.14);
    --text: #ececf1;
    --text-dim: #8f96a3;
    --text-faint: #5a6070;
    --accent: #7ab0e8;
    --accent-bright: #9cc4f0;
    --accent-soft: rgba(122,176,232,0.16);
    --glass: rgba(40,44,56,0.4);
    --glass-strong: rgba(40,44,56,0.55);
    --glass-border: rgba(255,255,255,0.16);
    --glass-hi: rgba(255,255,255,0.28);
    --shadow: 0 24px 64px rgba(0,0,0,0.5);
    --hairline: rgba(255,255,255,0.08);
    --ok: #8fbf8f;
    --danger: #c0655a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100dvh;
    transition: background .5s, color .5s;
    overflow-x: hidden;
  }
  /* 背景光斑 */
  body::before, body::after {
    content:''; position: fixed; pointer-events:none; z-index:0;
  }
  body::before {
    top:-20%; left:-18%; width:75%; height:65%;
    background: radial-gradient(ellipse at 30% 30%, var(--glow-1), transparent 65%);
  }
  body::after {
    bottom:-22%; right:-18%; width:70%; height:60%;
    background: radial-gradient(ellipse at 60% 60%, var(--glow-2), transparent 65%);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 20px 140px; position: relative; z-index: 1; }

  /* 椭圆导航 */
  .nav {
    display:flex; align-items:center; justify-content:space-between;
    margin: 20px 0 24px; padding: 10px 14px;
    border-radius: 999px;
    background: var(--glass);
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    box-shadow: var(--shadow), inset 0 2px 0 var(--glass-hi);
    border: 1px solid transparent; background-clip: padding-box;
    position: relative;
  }
  .nav::before {
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, var(--glass-hi), transparent 45%, transparent 65%, rgba(255,255,255,0.35));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  .nav-title { font-size:17px; font-weight:600; letter-spacing:1px; flex:1; text-align:center; }
  .nav-side { width:44px; display:flex; align-items:center; }
  .nav-side.right { justify-content:flex-end; }
  .nav-btn {
    width:40px; height:34px; border-radius:999px;
    background: var(--glass); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; user-select:none;
    box-shadow: inset 0 1px 0 var(--glass-hi);
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .nav-btn:active { transform: scale(.88) rotate(15deg); }

  /* 品牌行 */
  .header { display:flex; justify-content:space-between; align-items:center; padding: 24px 4px 18px; }
  .brand { font-size:12px; letter-spacing:4px; color:var(--accent); font-weight:600; text-transform:uppercase; }
  .today { font-size:12px; color:var(--text-dim); }

  /* 倒计时 */
  .countdown { margin-bottom:28px; }
  .cd-label { font-size:12px; color:var(--text-dim); letter-spacing:4px; margin-bottom:10px; display:flex; align-items:center; }
  .cd-label::after { content:''; width:60px; height:1px; background:var(--accent); opacity:.5; margin-left:14px; }
  .cd-number { display:flex; align-items:baseline; }
  .cd-days { font-size: clamp(100px, 26vw, 160px); font-weight:700; line-height:1; letter-spacing:-4px; color:var(--text); transition:color .5s; }
  .cd-unit { font-size:20px; color:var(--accent); letter-spacing:3px; margin-left:10px; }
  .cd-meta { margin-top:14px; font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .school-name { color:var(--text); font-weight:600; }
  .cd-change { color:var(--accent); font-size:12px; cursor:pointer; }
  .cd-info { margin-top:6px; font-size:12px; color:var(--text-faint); }

  /* 玻璃卡片 */
  .glass {
    position:relative; z-index:1;
    background: var(--glass);
    border-radius: 24px;
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    box-shadow: var(--shadow), inset 0 2px 0 var(--glass-hi), inset 0 -2px 0 rgba(255,255,255,0.12);
    padding: 22px; margin-bottom: 18px;
    border: 1px solid transparent; background-clip: padding-box;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
  }
  .glass::before {
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, var(--glass-hi), transparent 40%, transparent 60%, rgba(255,255,255,0.35));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none; z-index:2;
  }
  .glass:active { transform: translateY(-2px) scale(.99); }
  .sheen { overflow:hidden; }
  .sheen::after {
    content:''; position:absolute; top:0; left:-60%; width:45%; height:100%;
    background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.22) 50%, transparent 80%);
    animation: sheenMove 5s ease-in-out infinite;
    pointer-events:none; z-index:2;
  }
  @keyframes sheenMove { 0%{transform:translateX(0)} 60%{transform:translateX(360%)} 100%{transform:translateX(360%)} }

  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .tag { font-size:11px; color:var(--accent); letter-spacing:3px; font-weight:600; text-transform:uppercase; }
  .go-link { font-size:13px; color:var(--accent); cursor:pointer; }

  /* 选择学校 */
  .picker-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--hairline); }
  .picker-row:last-of-type { border-bottom:none; }
  .picker-label { color:var(--text-dim); font-size:14px; }
  .picker-value { color:var(--text); font-size:15px; font-weight:500; }
  .picker-arrow { color:var(--text-faint); font-size:13px; }
  .hint-text { font-size:11px; color:var(--text-faint); margin-top:8px; }
  .btn-ghost {
    margin-top:16px; display:block; width:100%;
    background: var(--glass); color:var(--accent);
    border:1px solid var(--glass-border); border-radius:999px;
    font-size:15px; padding:12px 0; cursor:pointer;
    backdrop-filter: blur(40px); box-shadow: inset 0 1px 0 var(--glass-hi);
  }
  /* 学校双按钮：添加学校高优先级 */
  .school-btns { display:flex; gap:10px; margin-top:16px; }
  .school-btn-main {
    flex:1; margin-top:0;
    background: var(--glass); color:var(--accent);
    border:1px solid var(--glass-border); border-radius:999px;
    font-size:14px; padding:12px 0; cursor:pointer;
    backdrop-filter: blur(40px); box-shadow: inset 0 1px 0 var(--glass-hi);
  }
  .btn-primary-add {
    flex:1; display:block;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    color:#fff; border:none; border-radius:999px;
    font-size:14px; font-weight:600; padding:12px 0; cursor:pointer;
    box-shadow: 0 8px 24px rgba(74,144,217,0.3), inset 0 2px 0 rgba(255,255,255,0.35);
    transition: transform .2s, opacity .2s;
  }
  .btn-primary-add:active { transform: scale(.96); opacity:.9; }
  .sheet-add-btn { margin-bottom:14px; }
  .btn-primary {
    display:block; width:100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    color:#fff; border:none; border-radius:999px;
    font-size:16px; font-weight:600; padding:14px 0; cursor:pointer;
    box-shadow: 0 12px 32px rgba(74,144,217,0.35), inset 0 2px 0 rgba(255,255,255,0.35);
  }
  .remind-desc { font-size:13px; color:var(--text-dim); margin-bottom:14px; }

  /* 进度 */
  .progress-row { display:flex; align-items:baseline; margin-bottom:12px; }
  .progress-num { font-size:40px; font-weight:700; color:var(--accent); }
  .progress-total { font-size:14px; color:var(--text-dim); margin-left:8px; }
  .progress-bar { height:6px; background:var(--glass-strong); border-radius:999px; overflow:hidden; position:relative; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius:999px; transition:width .5s cubic-bezier(.16,1,.3,1); box-shadow:0 0 12px var(--accent); position:relative; }
  .progress-fill::after {
    content:''; position:absolute; right:-3px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-radius:50%;
    background:var(--accent-bright); box-shadow:0 0 8px var(--accent-bright);
  }
  .progress-tip { margin-top:10px; font-size:12px; color:var(--text-dim); }

  /* 清单 */
  .group { padding: 6px 0 12px; }
  .group-head { display:flex; justify-content:space-between; align-items:center; padding: 12px 16px 8px; }
  .group-title { font-size:11px; letter-spacing:3px; color:var(--accent); font-weight:600; text-transform:uppercase; }
  .group-actions { display:flex; gap:14px; }
  .act { font-size:11px; color:var(--text-dim); cursor:pointer; }
  .act.danger { color:var(--danger); }
  .item { display:flex; align-items:flex-start; gap:12px; padding:12px 16px; border-radius:12px; cursor:pointer; transition: background .25s, transform .15s; }
  .item:hover { background: var(--accent-soft); }
  .item:active { transform: scale(.985); }
  /* 勾选动效：弹性回弹（有理由的动效：状态反馈） */
  .box {
    width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(141,143,150,0.55); flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    transition: all .3s cubic-bezier(.16,1,.3,1);
    position:relative;
  }
  .box::after {
    content:''; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid var(--ok); opacity:0; transform:scale(.6);
    transition: all .3s cubic-bezier(.16,1,.3,1);
  }
  .box.done { background:var(--ok); border-color:var(--ok); box-shadow:0 0 16px rgba(143,191,143,0.5); }
  .box.done::after { opacity:.4; transform:scale(1); }
  .tick { color:#fff; font-size:12px; font-weight:700; transform:scale(0); transition: transform .25s cubic-bezier(.34,1.56,.64,1) .05s; }
  .box.done .tick { transform:scale(1); }
  .item-body { flex:1; display:flex; flex-direction:column; }
  .label { font-size:14px; line-height:1.5; }
  .label.done { color:var(--text-faint); text-decoration:line-through; }
  .hint { font-size:11px; color:var(--text-dim); margin-top:1px; }
  .hint-empty { color:var(--text-faint); font-style: italic; }
  .item-del {
    width:26px; height:26px; border-radius:50%;
    background: rgba(208,106,94,0.12); color:var(--danger);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0; margin-top:2px;
    transition: all .2s; cursor:pointer;
  }
  .item-del:active { transform: scale(.85); background: rgba(208,106,94,0.25); }
  .add-item { display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; color:var(--text-dim); font-size:12px; border-top:1px solid var(--hairline); margin-top:6px; cursor:pointer; }
  .add-group {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; border:2px dashed var(--accent); border-radius:16px;
    color:var(--accent); font-size:14px; background:var(--glass); cursor:pointer; margin-bottom:18px;
  }
  .add-icon { font-size:18px; font-weight:600; }
  .footer-tip { text-align:center; font-size:11px; color:var(--text-faint); margin-top:24px; }

  /* 底部 Dock - 液态玻璃胶囊 */
  .dock-wrap {
    position:fixed; left:0; right:0; bottom:0; z-index:999;
    padding: 0 24px calc(env(safe-area-inset-bottom) + 14px);
    pointer-events:none; display:flex; justify-content:center;
  }
  .dock {
    display:flex; justify-content:space-around; align-items:center;
    pointer-events:auto;
    background: rgba(255,255,255,0.55);
    border-radius: 40px;
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    box-shadow: 0 24px 60px rgba(45,70,110,0.16), inset 0 2px 0 rgba(255,255,255,0.95);
    padding: 8px 10px;
    border: 1px solid transparent; background-clip:padding-box;
    position:relative;
  }
  [data-theme="dark"] .dock { background: rgba(44,48,60,0.6); box-shadow:0 24px 60px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.28); }
  .dock::before {
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.95), transparent 40%, transparent 60%, rgba(255,255,255,0.45));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  [data-theme="dark"] .dock::before { background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 40%, transparent 60%, rgba(255,255,255,0.15)); }
  .dock-item {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 34px; border-radius:999px; cursor:pointer;
    transition: all .3s cubic-bezier(.16,1,.3,1); user-select:none;
  }
  .dock-item.active { background: rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); }
  [data-theme="dark"] .dock-item.active { background: rgba(255,255,255,0.12); }
  .dock-icon { font-size:26px; line-height:1; color:#1c1c1e; transition: all .3s; }
  .dock-item.active .dock-icon { color:#4a90d9; transform: scale(1.08); }
  [data-theme="dark"] .dock-icon { color:#d5d7dd; }
  [data-theme="dark"] .dock-item.active .dock-icon { color:#7ab0e8; }
  .dock-text { font-size:10px; color:#1c1c1e; }
  .dock-item.active .dock-text { color:#4a90d9; font-weight:600; }
  [data-theme="dark"] .dock-text { color:#d5d7dd; }
  [data-theme="dark"] .dock-item.active .dock-text { color:#7ab0e8; }

  /* 模态（选学校/编辑弹窗） */
  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,0.35);
    backdrop-filter: blur(10px); z-index:1000;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .3s;
  }
  .modal-mask.open { opacity:1; pointer-events:auto; }
  .modal-sheet {
    width:100%; max-width:560px; background:rgba(248,249,251,0.9);
    backdrop-filter: blur(60px); border-radius: 28px 28px 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(100%); transition: transform .4s cubic-bezier(.16,1,.3,1);
    max-height: 75dvh; overflow-y:auto;
  }
  .modal-mask.open .modal-sheet { transform: translateY(0); }
  [data-theme="dark"] .modal-sheet { background: rgba(30,32,38,0.9); }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-title { font-size:18px; font-weight:600; }
  .sheet-close { font-size:22px; color:var(--text-dim); cursor:pointer; padding:4px 10px; }
  .search-box {
    display:flex; align-items:center; gap:10px;
    background: var(--glass); border-radius:999px; padding:12px 16px; margin-bottom:14px;
    border:1px solid var(--glass-border); backdrop-filter: blur(30px);
  }
  .search-box input { flex:1; border:none; outline:none; background:transparent; font-size:15px; color:var(--text); }
  .school-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 6px; border-bottom:1px solid var(--hairline); cursor:pointer;
  }
  .school-row:last-child { border-bottom:none; }
  .school-name-r { font-size:15px; font-weight:500; }
  .school-meta { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .school-check { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .sheet-btn { margin-top:16px; }
  .custom-btn { margin-top:12px; }

  /* 入场动画 */
  @keyframes fadeUp { from {opacity:0; transform:translateY(30px)} to {opacity:1; transform:translateY(0)} }
  .fade-up { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both; }
  .f-1 { animation-delay:.05s } .f-2 { animation-delay:.15s } .f-3 { animation-delay:.25s } .f-4 { animation-delay:.35s }

  /* 引导页样式 */
  .guide-mask {
    position: fixed; inset: 0; z-index: 2000;
    background: linear-gradient(160deg, #eef2f7, #f7f9fc);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .5s, visibility .5s;
  }
  [data-theme="dark"] .guide-mask { background: linear-gradient(160deg, #101218, #161a24); }
  .guide-mask.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .guide-card {
    width: 86%; max-width: 420px;
    background: var(--glass); border-radius: 28px;
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    box-shadow: var(--shadow), inset 0 2px 0 var(--glass-hi);
    padding: 40px 28px 32px; text-align: center;
    border: 1px solid transparent; background-clip: padding-box;
    position: relative;
  }
  .guide-card::before {
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, var(--glass-hi), transparent 45%, transparent 65%, rgba(255,255,255,0.35));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  .guide-logo {
    width: 84px; height: 84px; margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a90d9, #6aa8e8);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; box-shadow: 0 12px 32px rgba(74,144,217,0.35);
    animation: popIn .9s cubic-bezier(.16,1,.3,1) .2s both;
  }
  @keyframes popIn { from {opacity:0; transform:scale(.5) rotate(-20deg)} to {opacity:1; transform:scale(1) rotate(0)} }
  .guide-title { font-size: 26px; font-weight: 700; letter-spacing: 2px; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .35s both; }
  .guide-sub { font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-top: 8px; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .45s both; }
  .guide-designer {
    display: flex; align-items: center; gap: 14px; justify-content: flex-start;
    background: var(--glass); border-radius: 20px; padding: 16px; margin: 28px 0;
    text-align: left; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .55s both;
    border: 1px solid var(--glass-border);
  }
  .guide-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #4a90d9, #6aa8e8);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; font-weight: 700; flex-shrink: 0;
  }
  .guide-designer-name { font-size: 15px; font-weight: 600; }
  .guide-designer-desc { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .guide-btn {
    display: block; width: 100%;
    background: linear-gradient(135deg, #4a90d9, #6aa8e8);
    color: #fff; border: none; border-radius: 999px;
    font-size: 17px; font-weight: 600; padding: 15px 0; cursor: pointer;
    box-shadow: 0 16px 40px rgba(74,144,217,0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .65s both;
    transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;
  }
  .guide-btn:active { transform: scale(.96); box-shadow: 0 8px 20px rgba(74,144,217,0.25); }

    ['运动鞋','军训 + 日常'],['内衣袜子','多备几套，单独收纳']]},
  {g:'数码与学习', items:[

  {g:'军训', items:[
    ['防晒霜','军训暴晒必备'],['清凉贴','站军姿降温'],['鞋垫','军训鞋硬，加软垫']]}
];

/* ========== 存储 ========== */
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

/* ========== 主题 ========== */
function toggleTheme() {
  const cur = document.body.dataset.theme;
  const next = cur === 'light' ? 'dark' : 'light';
  document.body.dataset.theme = next;
  document.getElementById('themeBtn').textContent = next === 'light' ? '🌙' : '☀️';
  store.set('theme', next);
}

/* ========== 状态 ========== */
let school = store.get('school', {name:'浙江科技大学', date:'2026-09-06', campus:'安吉校区'});
let items = store.get('items', null) || JSON.parse(JSON.stringify(DEFAULT_ITEMS));
let activeTab = 0;

/* ========== 倒计时 ========== */
function calcDays(dateStr) {
  if (!dateStr) return 0;
  const p = dateStr.split('-');
  const target = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  const diff = target - new Date();
  return Number.isFinite(diff) ? Math.max(0, Math.ceil(diff/86400000)) : 0;
}

/* ========== 渲染 ========== */
function renderAll() {
  // 日期
  const now = new Date();
  document.getElementById('todayText').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
  // 倒计时
  const days = calcDays(school.date);
  document.getElementById('days').textContent = days;
  document.getElementById('schoolName').textContent = school.name;
  document.getElementById('schoolCampus').textContent = school.campus ? '· '+school.campus : '';
  document.getElementById('cdInfo').textContent = '开学：' + (school.date || '未设置');
  document.getElementById('dateValue').textContent = school.date || '选择日期';
  // 进度
  let done = 0, total = 0;
  items.forEach(g => g.items.forEach(it => { total++; if (it.done) done++; }));
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = '/ ' + total + ' 已准备';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressTip').textContent = done === total ? '全齐了，就等出发 🎒' : '还差 ' + (total-done) + ' 件，时间够';
  document.getElementById('listPct').textContent = done + ' / ' + total + ' 已准备';
  // 清单
  renderGroups();
}

function renderGroups() {
  const el = document.getElementById('groups');
  el.innerHTML = '';
  items.forEach((g, gi) => {
    const div = document.createElement('div');
    div.className = 'glass sheen';
    let html = '<div class="group-head"><span class="group-title">'+g.g+'</span>' +
      '<div class="group-actions"><span class="act" onclick="renameGroup('+gi+')">重命名</span>' +
      '<span class="act danger" onclick="deleteGroup('+gi+')">删除</span></div></div>';
    g.items.forEach((it, ii) => {
      html += '<div class="item" onclick="toggleItem('+gi+','+ii+')">' +
        '<span class="box'+(it.done?' done':'')+'">'+(it.done?'<span class="tick">✓</span>':'')+'</span>' +
        '<span class="item-body">' +
          '<span class="label'+(it.done?' done':'')+'">'+it[0]+'</span>' +
          (it[1] ? '<span class="hint" onclick="event.stopPropagation();editHint('+gi+','+ii+')">'+it[1]+' ✎</span>' : '<span class="hint hint-empty" onclick="event.stopPropagation();editHint('+gi+','+ii+')">添加备注 ✎</span>') +
        '</span>' +
        '<span class="item-del" onclick="event.stopPropagation();deleteItem('+gi+','+ii+')">✕</span></div>';
    });
    html += '<div class="add-item" onclick="addItem('+gi+')"><span class="add-icon">＋</span>添加物品</div>';
    div.innerHTML = html;
    el.appendChild(div);
  });
}

/* ========== 清单操作 ========== */
function toggleItem(gi, ii) {
  items[gi].items[ii].done = !items[gi].items[ii].done;
  store.set('items', items); renderAll();
}
function addItem(gi) {
  const name = prompt('物品名称：');
  if (name && name.trim()) {
    items[gi].items.push([name.trim(), '']);
    store.set('items', items); renderAll();
  }
}
function deleteItem(gi, ii) {
  if (confirm('删除「'+items[gi].items[ii][0]+'」？')) {
    items[gi].items.splice(ii, 1);
    store.set('items', items); renderAll();
  }
}
function editHint(gi, ii) {
  const cur = items[gi].items[ii][1] || '';
  const h = prompt('编辑备注（可留空）：', cur);
  if (h !== null) {
    items[gi].items[ii][1] = h.trim();
    store.set('items', items); renderAll();
  }
}
function addGroup() {
  const name = prompt('分组名称：');
  if (name && name.trim()) {
    items.push({g: name.trim(), items: []});
    store.set('items', items); renderAll();
  }
}
function renameGroup(gi) {
  const name = prompt('重命名分组：', items[gi].g);
  if (name && name.trim()) {
    items[gi].g = name.trim();
    store.set('items', items); renderAll();
  }
}
function deleteGroup(gi) {
  if (confirm('删除「'+items[gi].g+'」及所有物品？')) {
    items.splice(gi, 1);
    store.set('items', items); renderAll();
  }
}

/* ========== 选学校 ========== */
let customSchools = store.get('customSchools', []);
function openSchoolModal() {
  document.getElementById('schoolModal').classList.add('open');
  document.getElementById('schoolSearch').value = '';
  renderSchoolList(SCHOOLS);
}
function closeSchoolModal() {
  document.getElementById('schoolModal').classList.remove('open');
}
function filterSchools(kw) {
  const k = (kw||'').trim();
  const list = k ? SCHOOLS.filter(s => s.name.includes(k)) : SCHOOLS;
  renderSchoolList(list);
}
function renderSchoolList(list) {
  const el = document.getElementById('schoolList');
  el.innerHTML = '';
  const all = list.concat(customSchools.map(c => ({name:c.name, date:c.date, campus:'', custom:true})));
  all.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'school-row';
    row.innerHTML = '<div><div class="school-name-r">'+s.name+'</div>' +
      (s.campus ? '<div class="school-meta">'+s.campus+' · '+s.date+' 开学</div>' : '<div class="school-meta">'+s.date+' 开学</div>') + '</div>' +
      (s.name === school.name ? '<span class="school-check">✓</span>' : '');
    row.onclick = () => {
      school = {name: s.name, date: s.date, campus: s.campus || ''};
      store.set('school', school);
      closeSchoolModal(); renderAll();
    }; el.appendChild(row);
  });
}
function addCustomSchool() {
  const name = prompt('学校名称：');
  if (!name || !name.trim()) return;
  const date = prompt('开学日期（如 2026-09-06）：', '2026-09-06');
  const d = date && /^\d{4}-\d{2}-\d{2}$/.test(date.trim()) ? date.trim() : '2026-09-06';
  const newSchool = {name:name.trim(), date:d, campus:''};
  customSchools.push(newSchool);
  store.set('customSchools', customSchools);
  // 添加后自动选中
  school = {name:newSchool.name, date:newSchool.date, campus:''};
  store.set('school', school);
  closeSchoolModal();
  renderAll();
  alert('已添加并选择「' + newSchool.name + '」');
}
function openDatePicker() {
  const input = document.createElement('input');
  input.type = 'date';
  input.value = school.date || '2026-09-06';
  input.min = '2020-01-01';
  input.max = '2035-12-31';
  input.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    if (input.value) {
      school.date = input.value;
      store.set('school', school);
      renderAll();
    }
    document.body.removeChild(input);
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { if (document.body.contains(input)) document.body.removeChild(input); }, 500);
  });
  input.showPicker ? input.showPicker() : input.click();
}

/* ========== Tab ========== */
function showTab(i) {
  activeTab = i;

  const k = (kw || '').trim();
  const list = k ? SCHOOLS.filter(s => s.name.includes(k)) : SCHOOLS.slice(0, 8);
  renderGuideSchools(list);
}

function guideTime() {
  guideCard.innerHTML =
    '<div class="guide-steps">' +
      '<div class="gstep done"><div class="gstep-num">1</div><div class="gstep-label">学校</div></div>' +
      '<div class="gstep-line done"></div>' +
      '<div class="gstep done"><div class="gstep-num">2</div><div class="gstep-label">时间</div></div>' +
      '<div class="gstep-line"></div>' +
      '<div class="gstep"><div class="gstep-num">3</div><div class="gstep-label">清单</div></div>' +
    '</div>' +
    '<div style="margin-bottom:18px;color:var(--text);font-size:15px;font-weight:500">已选择：'+school.name+(school.campus?' · '+school.campus:'')+'</div>' +
    '<div class="guide-date-row" onclick="guideDatePick()">' +
      '<span style="color:var(--text-dim);font-size:14px">开学日期</span>' +
      '<span class="guide-date-big" id="guideDateVal">'+(school.date||'点击选择')+'</span>' +
    '</div>' +
    '<div class="guide-date-tip">点击上方日期自行选择</div>' +
    '<button class="guide-btn" onclick="guideFinish()">下一步：编辑清单 →</button>';
}

function guideQuick(el) {
  school.date = el.dataset.d;
  store.set('school', school);
  document.getElementById('guideDateVal').textContent = school.date;
  document.querySelectorAll('.guide-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function guideDatePick() {
  // 用原生日期选择器（手机友好）
  const input = document.createElement('input');
  input.type = 'date';
  input.value = school.date || '2026-09-06';
  input.min = '2020-01-01';
  input.max = '2035-12-31';
  input.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    if (input.value) {
      school.date = input.value;
      store.set('school', school);
      document.getElementById('guideDateVal').textContent = school.date;
    }
    document.body.removeChild(input);
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { if (document.body.contains(input)) document.body.removeChild(input); }, 500);
  });
  input.showPicker ? input.showPicker() : input.click();
}

function guideNext() {
  guideStep = 1;
  guideSchool();
}

function guideFinish() {
  store.set('onboarded', true);
  guideMask.classList.add('hidden');
  renderAll();
}

/* ========== 初始化 ========== */
(function init() {
  const t = store.get('theme', 'light');
  document.body.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'light' ? '🌙' : '☀️';
  // 首次访问引导
  const onboarded = store.get('onboarded', false);
  if (onboarded) {
    guideMask.classList.add('hidden');
  } else {
    guideWelcome();
  }
  renderAll();
})();
</script>
</body>
</html>
